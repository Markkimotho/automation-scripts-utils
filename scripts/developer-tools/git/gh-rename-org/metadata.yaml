id: gh-rename-org
title: "Gh Rename Org"
description: "Rename an organization. Checks you own it and the new name is free, opens the settings page (github.com has no rename API), waits until GitHub serves the new name, repoints remotes under `--scan-dir`, and lists files still naming the old org."
