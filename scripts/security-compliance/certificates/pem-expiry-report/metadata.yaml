id: pem-expiry-report
title: PEM Certificate Expiry Report
description: Report expired, not-yet-valid and soon-expiring certificates in a local
  PEM bundle without contacting remote services.
category: security-compliance
topic: certificates
language: go
entrypoint: scripts/security-compliance/certificates/pem-expiry-report/script.go
platforms:
- macos
dependencies:
- go
permissions:
- filesystem-read
destructive: false
requires_confirmation: false
supports_dry_run: false
parameters:
- name: input
  type: string
  required: true
  flag: --input
- name: as_of
  type: string
  required: false
  flag: --as-of
- name: warn_days
  type: integer
  required: false
  flag: --warn-days
tags:
- certificates
- offline
- audit
- go
expected_output: JSON observation time, certificate SHA-256 fingerprints, validity
  dates, remaining seconds and statuses.
status: maintained
version: 1.0.0
maintainer: Automation Scripts & Utils contributors
runtime_requirements: Go >=1.24; standard library only. Maintained Go releases recommended.
environment_variables: []
exit_codes:
  '0': Inspection completed without findings.
  '1': Validity, overlap or file-integrity findings.
  '2': Invalid input, unreadable input, resource limit or compilation/execution error.
provenance_ref: pem-expiry-report
test_status: passed
compatibility_notes: Verified locally on macOS with Go 1.26.4. Cross-platform CI is
  configured separately; only macOS is declared supported.
usage_example: automation run pem-expiry-report -- --input ./certificates.pem --warn-days
  30
