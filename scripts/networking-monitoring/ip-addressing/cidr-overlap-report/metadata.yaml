id: cidr-overlap-report
title: CIDR Overlap Report
description: Find duplicate and nested IPv4 or IPv6 CIDR allocations offline, preserving
  input line numbers and normalizing host bits.
category: networking-monitoring
topic: ip-addressing
language: go
entrypoint: scripts/networking-monitoring/ip-addressing/cidr-overlap-report/script.go
platforms:
- macos
dependencies:
- go
permissions:
- filesystem-read
destructive: false
requires_confirmation: false
supports_dry_run: false
parameters:
- name: input
  type: string
  required: true
  flag: --input
- name: max_findings
  type: integer
  required: false
  flag: --max-findings
tags:
- ip-addressing
- offline
- audit
- go
expected_output: JSON normalized networks, overlap count, overlapping line-number
  pairs and truncation status.
status: maintained
version: 1.0.0
maintainer: Automation Scripts & Utils contributors
runtime_requirements: Go >=1.24; standard library only. Maintained Go releases recommended.
environment_variables: []
exit_codes:
  '0': Inspection completed without findings.
  '1': Validity, overlap or file-integrity findings.
  '2': Invalid input, unreadable input, resource limit or compilation/execution error.
provenance_ref: cidr-overlap-report
test_status: passed
compatibility_notes: Verified locally on macOS with Go 1.26.4. Cross-platform CI is
  configured separately; only macOS is declared supported.
usage_example: automation run cidr-overlap-report -- --input ./networks.txt
