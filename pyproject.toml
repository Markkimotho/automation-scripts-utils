[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "automation-scripts-utils"
version = "0.1.0"
description = "Search and run practical, cross-platform automation scripts"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "Automation Scripts & Utils contributors"}]
keywords = ["automation", "cli", "scripts", "devops", "productivity"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Environment :: Console",
  "Topic :: System :: Systems Administration",
  "Topic :: Software Development :: Libraries",
]
dependencies = []

[project.urls]
Homepage = "https://markkimotho.github.io/automation-scripts-utils/"
Repository = "https://github.com/Markkimotho/automation-scripts-utils"
Documentation = "https://markkimotho.github.io/automation-scripts-utils/"

[project.scripts]
automation = "automation_cli:main"

[tool.setuptools]
py-modules = ["automation_cli"]

[tool.setuptools.package-dir]
"" = "cli"
